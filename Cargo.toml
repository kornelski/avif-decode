[package]
name = "avif-decode"
version = "2.0.0"
authors = ["Kornel <kornel@geekhood.net>"]
categories = ["multimedia::images"]
description = "Convert AVIF images to PNG or decompressed pixel data"
homepage = "https://lib.rs/avif-decode"
keywords = ["av1", "libaom", "decoder", "heif"]
license = "BSD-3-Clause"
repository = "https://github.com/kornelski/avif-decode"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "avif-decode"
path = "src/main.rs"
required-features = ["binary"]

[dependencies]
aom-decode = "1.0.0"
imgref = "1.12.3"
lodepng = { version = "3.12.2", optional = true }
quick-error = "2.0.1"
rgb = "0.8.53"

[features]
default = ["binary"]
binary = ["dep:lodepng"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true

[badges]
maintenance = { status = "passively-maintained" }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]
